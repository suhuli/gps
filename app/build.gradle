plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    namespace "com.yadea.smartmoto"
    buildFeatures { viewBinding true; buildConfig true }
    testOptions { unitTests.all { maxHeapSize = "256m" } }
    compileSdkVersion rootProject.ext.android.compileSdkVersion

    dataBinding {
        enabled true
    }

    defaultConfig {
        applicationId rootProject.ext.android.applicationId
        minSdkVersion rootProject.ext.android.minSdkVersion
        targetSdkVersion rootProject.ext.android.targetSdkVersion
        versionCode rootProject.ext.android.versionCode
        versionName rootProject.ext.android.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
    }

    signingConfigs {
        fixed {
            if (System.getenv('GPS_KEYSTORE_PATH')) {
                storeFile file(System.getenv('GPS_KEYSTORE_PATH'))
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [MAP_KEY: rootProject.ext.android.map_key, AMAP_KEY: rootProject.ext.android.amap_key]
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [MAP_KEY: rootProject.ext.android.map_key, AMAP_KEY: rootProject.ext.android.amap_key]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'com.amap.api:3dmap-location-search:11.3.100_loc11.3.101_sea9.8.1'
    testImplementation 'junit:junit:4.13.2'
    implementation project(':common')
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Location:9.7.0'
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Map:8.2.0.2'
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Search:8.2.0.2'
}
// A missing signing identity must not silently produce a different debug certificate.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().startsWith('package') } && !System.getenv('GPS_KEYSTORE_PATH')) {
        throw new GradleException('Fixed signing identity is required for APK packaging')
    }
}
