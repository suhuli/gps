name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to build
        required: true
        type: choice
        default: main
        options:
          - main
      application_id:
        description: Android package name (lowercase, dotted)
        required: true
        type: string
        default: com.yadea.smartmoto
      baidu_map_key:
        description: Baidu Android map Key (optional; blank uses BAIDU_MAP_KEY Secret)
        required: false
        type: string
        default: ''
      amap_map_key:
        description: AMap Android Key (optional; blank uses AMAP_MAP_KEY Secret)
        required: false
        type: string
        default: ''
      build_type:
        description: APK variant (both use the same fixed signing certificate)
        required: true
        type: choice
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.actor }}-${{ inputs.source_branch }}-${{ inputs.build_type }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: source

env:
  APP_NAME: '雅迪智行'
  APPLICATION_ID: ${{ inputs.application_id }}
  SOURCE_BRANCH: ${{ inputs.source_branch }}
  BUILD_TYPE: ${{ inputs.build_type }}
  EXPECTED_SIGNING_SHA1: DB:08:33:1A:25:37:F2:BC:72:0D:54:A8:17:2B:E5:38:89:AF:89:95

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: echo "Only main may be built"; exit 1
        working-directory: ${{ github.workspace }}

      - name: Check out trusted workflow helper scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-config
          persist-credentials: false

      - name: Check out selected source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare package name and fixed signing certificate
        env:
          BAIDU_MAP_KEY: ${{ secrets.BAIDU_MAP_KEY }}
          AMAP_MAP_KEY: ${{ secrets.AMAP_MAP_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 ../ci-config/.github/scripts/prepare_android.py

      - name: Run coordinate and track-parser unit tests
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" :app:testDebugUnitTest

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          case "$BUILD_TYPE" in
            release) ./gradlew --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" :app:assembleRelease ;;
            debug) ./gradlew --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" :app:assembleDebug ;;
            *) echo 'Unsupported build type'; exit 1 ;;
          esac

      - name: Verify APK package and fixed SHA-1
        run: python3 ../ci-config/.github/scripts/verify_apk.py

      - name: Verify ARM64 native page alignment
        run: python3 ../ci-config/.github/scripts/check_native_alignment.py

      - name: Upload APK and public signing fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: yadea-smartmoto-${{ inputs.build_type }}-${{ github.run_number }}
          path: source/artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            source/app/build/reports/
            source/common/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/gps-signing.p12"
