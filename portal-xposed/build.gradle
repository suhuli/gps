plugins { id 'com.android.library'; id 'kotlin-android' }
android {
 namespace 'moe.fuqiuluo.xposed'
 compileSdk 35
 ndkVersion '27.2.12479018'
 buildFeatures { prefab true }
 externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
 defaultConfig {
  minSdk 26
  ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
}
dependencies {
 compileOnly 'de.robv.android.xposed:api:82'
 compileOnly project(':portal-system-api')
 implementation project(':portal-nmea')
 implementation 'io.github.vvb2060.ndk:dobby:1.2'
}
// Bundled native library only; fixed-path module loader, no remote load_library command.

dependencies { testImplementation 'junit:junit:4.13.2' }
