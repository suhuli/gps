plugins { id 'com.android.library'; id 'kotlin-android' }
android {
 namespace 'moe.fuqiuluo.xposed'
 compileSdk 35
 defaultConfig { minSdk 26 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
}
dependencies {
 compileOnly 'de.robv.android.xposed:api:82'
 compileOnly project(':portal-system-api')
 implementation project(':portal-nmea')
}
// Native sources are preserved for the later sensor milestone; no arbitrary library loader is exposed.

dependencies { testImplementation 'junit:junit:4.13.2' }
